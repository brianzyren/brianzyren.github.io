/* VOICE clean, confident student engineering portfolio, skimmable in under a minute
   IDEA a robotics lab bench: concrete-grey surfaces, black hardware, one safety-orange accent (the MasterPi's own orange)
   PICTURE the strongest project (Nova CAD) as a large featured card in the first screen
   COLOUR white, concrete #f1f1ee panels, ink #121316, safety orange accent
   TYPE Hanken Grotesk 800 display + Hanken Grotesk text
   LAYOUT big name over a featured project; 2x2 grid of the rest; project pages lead with facts, summary, large visuals */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1012);--ink:light-dark(#121316,#eeeeec);--soft:light-dark(#5f626a,#a1a4ab);--line:light-dark(#e3e3df,#26282d);--panel:light-dark(#f1f1ee,#18191c);--acc:light-dark(#e2560c,#ff8a47);--accbg:light-dark(#fff1e8,#2a1a10)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Hanken Grotesk",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit}
img,video{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding-inline:max(5vw,16px)}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;gap:4px 26px;align-items:center;min-height:64px}
.logo{margin-right:auto;font-weight:800;text-decoration:none;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--acc);display:block}
header nav a{text-decoration:none;color:var(--soft);font-weight:500;padding:10px 0}
header nav{display:flex;gap:24px}
header nav a:hover{color:var(--ink)}
a:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:6px}
h1,h2,h3{letter-spacing:-.02em;margin:0}
.hello{padding-block:clamp(48px,8vw,96px) clamp(32px,4vw,48px)}
.hello h1{font-size:clamp(52px,9vw,104px);line-height:.95;font-weight:800;letter-spacing:-.04em}
.hello h1 span{color:var(--soft);font-weight:600;display:block;font-size:.38em;letter-spacing:-.02em;line-height:1.15;margin-top:14px;max-width:18em}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-weight:600;background:var(--bg);transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.p:hover{background:var(--acc);border-color:var(--acc)}
.now{display:inline-flex;align-items:center;gap:10px;color:var(--soft);font-size:15px;margin-left:6px}
.now i{width:8px;height:8px;border-radius:50%;background:#22a55a;box-shadow:0 0 0 4px color-mix(in srgb,#22a55a 22%,transparent);display:block}
.label{font-size:14px;font-weight:600;color:var(--acc);margin:0 0 10px}
.feat{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);border-radius:20px;overflow:hidden;background:var(--panel);text-decoration:none;color:var(--ink)}
.feat .img{min-height:360px;position:relative;overflow:hidden;background:#d9d9d4}
.feat .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.feat:hover .img img,.card:hover .img img{transform:scale(1.04)}
.feat .txt{padding:clamp(24px,3.5vw,44px);display:flex;flex-direction:column;justify-content:center}
.feat h2{font-size:clamp(28px,3.2vw,38px);line-height:1.08;margin-bottom:12px}
.feat p{color:var(--soft);margin:0 0 18px}
.more{font-weight:700;display:inline-flex;gap:8px;align-items:center;margin-top:18px}
.more b{transition:transform .2s;font-weight:700}
.feat:hover .more b,.card:hover .more b{transform:translateX(4px)}
.sec{padding-block:clamp(48px,6vw,80px) 0}
.sec h2.t{font-size:clamp(26px,3vw,34px);margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);border-radius:18px;overflow:hidden;background:var(--panel)}
.card .img{aspect-ratio:16/10;overflow:hidden;position:relative;background:#d9d9d4}
.card .img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card .img svg{width:100%;height:100%;background:var(--panel)}
.card .txt{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:21px;line-height:1.2;margin-bottom:6px}
.card p{margin:0;color:var(--soft);font-size:16px}
.card .more{margin-top:auto;padding-top:14px;font-size:15px}
.play{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.62);color:#fff;font-size:13px;font-weight:600;border-radius:999px;padding:5px 12px 5px 10px;display:flex;align-items:center;gap:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tags li{font-size:13px;font-weight:500;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
.about{margin-top:clamp(56px,7vw,96px);background:var(--panel);padding-block:clamp(44px,6vw,72px)}
.ab{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,64px)}
.ab p{color:var(--soft);margin:12px 0 0;max-width:30em}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.cols h3,.lead h3{font-size:15px;color:var(--acc);margin-bottom:8px}
.lead{margin-top:28px;border-top:1px solid var(--line);padding-top:16px;max-width:30em}
.lead p{margin:0!important;color:var(--ink)!important;font-size:16px}
.cols ul{list-style:none;margin:0;padding:0}
.cols li{padding:7px 0;border-top:1px solid var(--line);font-size:16px}
footer{padding-block:40px;color:var(--soft);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:space-between;align-items:center}
footer a{text-decoration:none;font-weight:600;color:var(--ink)}
footer a:hover{color:var(--acc)}
/* project page */
.proj{padding-block:28px 0}
.back{display:inline-flex;gap:8px;text-decoration:none;color:var(--soft);font-weight:600;padding:8px 0;margin-bottom:18px}
.back:hover{color:var(--ink)}
.proj h1{font-size:clamp(36px,5.4vw,60px);line-height:1.02;font-weight:800;letter-spacing:-.03em;max-width:16em;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:14px 16px 14px 0}
.facts small{display:block;font-size:13px;color:var(--soft);font-weight:500}
.facts span{font-weight:700}
.summary{font-size:clamp(19px,2vw,22px);line-height:1.5;max-width:38em;margin:0 0 32px}
.hero{border-radius:20px;overflow:hidden;background:var(--panel)}
.hero img{width:100%;max-height:620px;object-fit:contain;margin:0 auto}
.hero video{width:100%;height:min(600px,78vh);background:#000}
.hero svg{width:100%;height:420px}
figure{margin:0}
figcaption{font-size:14px;color:var(--soft);padding:10px 4px 0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px;margin-top:24px}
.gallery .box{border-radius:14px;overflow:hidden;background:var(--panel);aspect-ratio:4/3}
.gallery .box.tall{aspect-ratio:3/4;background:#000}
.gallery img,.gallery video{width:100%;height:100%;object-fit:cover}
.gallery video{object-fit:contain}
.secs{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,4vw,56px);margin-top:clamp(40px,5vw,64px);align-items:start}
.secs h2{font-size:26px;margin-bottom:16px}
.dots{list-style:none;margin:0;padding:0}
.dots li{position:relative;padding:10px 0 10px 24px;border-top:1px solid var(--line)}
.dots li:first-child{border-top:0;padding-top:0}
.dots li::before{content:"";position:absolute;left:2px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.dots li:first-child::before{top:9px}
.secs h3{font-size:15px;color:var(--soft);font-weight:600;margin:26px 0 10px}
.change{background:var(--accbg);border-radius:18px;padding:26px 26px 22px}
.change .dots li{border-top-color:color-mix(in srgb,var(--acc) 22%,transparent)}
.change .dots li::before{background:transparent;border:2px solid var(--acc);width:9px;height:9px}
.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;margin-top:clamp(48px,6vw,80px);padding:16px;border-radius:18px;background:var(--panel);text-decoration:none;color:var(--ink)}
.next .th{width:120px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#d9d9d4}
.next .th img,.next .th svg{width:100%;height:100%;object-fit:cover;background:var(--panel)}
.next small{display:block;color:var(--soft);font-weight:500;font-size:14px}
.next strong{font-size:20px;letter-spacing:-.01em}
.next b{font-size:22px;padding-right:10px;transition:transform .2s}
.next:hover b{transform:translateX(4px)}
.pill{position:absolute;left:14px;top:14px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px}
.pill.s{position:static;display:inline-block;margin-bottom:10px}
.card .img svg{background:var(--panel)}
.wblock{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,48px);align-items:start;padding-block:36px;border-top:1px solid var(--line)}
.wblock:first-of-type{border-top:0}
.wfig{border-radius:18px;background:var(--panel);aspect-ratio:4/3}
.wfig svg{width:100%;height:100%}
.wblock h2{font-size:clamp(26px,3vw,34px);margin-bottom:8px}
.wblock p{color:var(--soft);margin:0}
.wblock h3{font-size:15px;color:var(--soft);font-weight:600;margin:22px 0 8px}
.dots.open li::before{background:transparent;border:2px solid var(--acc);width:9px;height:9px}
svg text{font-family:"Hanken Grotesk",sans-serif}
@media(max-width:860px){.feat,.ab,.wblock{grid-template-columns:minmax(0,1fr)}.feat .img{min-height:240px;aspect-ratio:16/10}.secs{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}.cols{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.next{grid-template-columns:minmax(0,1fr) auto}.next .th{display:none}.now{margin-left:0}header nav{gap:18px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>

  <a class="card" href="#${p.id}"><div class="img">${thumb(p)}</div><div class="txt"><h3>${esc(p.title)}</h3><p>${esc(p.card)}</p><span class="more">View project <b>→</b></span></div></a>`).join('')}
 </div>
</section>
<section class="wrap sec" aria-label="In progress">
 <h2 class="t">In progress</h2>
 <div class="grid">${W.map(w=>`
  <a class="card" href="#wip"><div class="img">${svg(w.draw)}<span class="pill">${esc(w.status)}</span></div><div class="txt"><h3>${esc(w.title)}</h3><p>${esc(w.summary)}</p><span class="more">See plans <b>→</b></span></div></a>`).join('')}
 </div>
</section>
<section class="about" id="about-me"><div class="wrap ab">
 <div><h2 class="t" style="font-size:clamp(26px,3vw,34px)">About me</h2><p>I'm a second-year Mechatronic Systems Engineering student at Simon Fraser University and a mechanical team member on Team Astra, SFU's UAV design team. I want to work in automotive, robotics and aerospace engineering. I speak English, Mandarin and French.</p><div class="lead"><h3>Leadership</h3><p>Air Cadets Flight Commander</p></div></div>
 <div class="cols">
  <div><h3>Education</h3><ul><li>BASc Mechatronic Systems Engineering</li><li>SFU Surrey, 2nd year</li><li>Graduating Spring 2030</li></ul></div>
  <div><h3>Programming</h3><ul><li>Python</li><li>C++ and C</li><li>Java</li><li>MATLAB</li></ul></div>
  <div><h3>CAD and hardware</h3><ul><li>SolidWorks, Onshape</li><li>AutoCAD</li><li>Arduino, Raspberry Pi</li><li>Altium, Multisim</li></ul></div>
 </div>
 </div>
</div></section>`;
};

const media=m=>m.k==='vid'
 ?`<figure><div class="box tall"><video src="${esc(m.src)}" poster="${esc(m.poster||'')}" controls playsinline muted preload="none"></video></div><figcaption>${esc(m.cap)}</figcaption></figure>`
 :`<figure><div class="box"><img src="${esc(m.src)}" alt="${esc(m.cap)}" loading="lazy"></div><figcaption>${esc(m.cap)}</figcaption></figure>`;

const page=p=>{
 const i=P.indexOf(p),nx=P[(i+1)%P.length],m=p.media||[];
 const h=m[0];
 const hero=h?`<figure><div class="hero">${h.k==='vid'?`<video src="${esc(h.src)}" poster="${esc(h.poster)}" controls playsinline muted preload="none"></video>`:`<img src="${esc(h.src)}" alt="${esc(h.cap)}">`}</div><figcaption>${esc(h.cap)}</figcaption></figure>`:`<figure><div class="hero">${svg(p.draw)}</div><figcaption>Layout of the main parts</figcaption></figure>`;
 return `<article class="wrap proj">
 <a class="back" href="#">← All projects</a>
 <h1>${esc(p.title)}</h1>
 <div class="facts">${p.facts.map(([k,v])=>`<div><small>${esc(k)}</small><span>${esc(v)}</span></div>`).join('')}</div>
 <p class="summary">${esc(p.summary)}</p>
 ${hero}
 ${m.length>1?`<div class="gallery">${m.slice(1).map(media).join('')}</div>`:''}
 <div class="secs">
  <div><h2>What I did</h2><ul class="dots">${p.role.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><h3>Skills used</h3>${tags(p.skills)}</div>
  <div class="change"><h2>What I'd change</h2><ul class="dots">${p.change.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
 </div>
 <a class="next" href="#${nx.id}"><div class="th">${thumb(nx).replace(/<span class="play">.*?<\/span>/,'')}</div><div><small>Next project</small><strong>${esc(short(nx.title))}</strong></div><b>→</b></a>
</article>`;
};

const wip=()=>`<article class="wrap proj">
 <a class="back" href="#">← All projects</a>
 <h1>Work in progress</h1>
 <p class="summary" style="margin-top:18px">Projects I'm building or planning right now. These pages change as the work moves forward.</p>
 ${W.map(w=>`<section class="wblock" id="w-${w.id}">
  <div class="wfig">${svg(w.draw)}</div>
  <div><span class="pill s">${esc(w.status)}</span><h2>${esc(w.title)}</h2><p>${esc(w.summary)}</p>
   <h3>Goals</h3><ul class="dots">${w.goal.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
   <h3>Next steps</h3><ul class="dots open">${w.next.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
 </section>`).join('')}
 <a class="next" href="#${P[0].id}"><div class="th">${thumb(P[0]).replace(/<span class="play">.*?<\/span>/,'')}</div><div><small>Finished projects</small><strong>Start with ${esc(short(P[0].title))}</strong></div><b>→</b></a>
</article>`;

const route=()=>{
 const id=location.hash.slice(1),p=P.find(x=>x.id===id);
 app.innerHTML=p?page(p):id==='wip'?wip():home();
 if(p||id==='wip')window.scrollTo(0,0);
 else if(id==='about-me')document.getElementById('about-me')?.scrollIntoView();
 else window.scrollTo(0,0);
 document.title=p?`${short(p.title)} · Brian Ren`:id==='wip'?'In progress · Brian Ren':'Brian Ren Portfolio';
};
window.addEventListener('hashchange',route);
route();
}
</script>
</body>
</html>
